name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --upgrade pyyaml jsonschema pytest

      - name: Resolve version from GitHub Release tag
        id: version
        shell: bash
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo 'Release tag produced an empty version.' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run domain and migration tests
        run: >-
          python -m pytest -q -p no:cacheprovider

      - name: Download pinned canonical engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/gpt-byggaren-engine-1.6.33.zip \
            https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip
          python - <<'PY'
          import pathlib, zipfile
          path = pathlib.Path('/tmp/gpt-byggaren-engine-1.6.33.zip')
          with zipfile.ZipFile(path) as archive:
              for item in archive.infolist():
                  parts = pathlib.PurePosixPath(item.filename)
                  if parts.is_absolute() or '..' in parts.parts or not parts.parts:
                      raise ValueError(f'Unsafe engine archive entry: {item.filename}')
              archive.extractall('/tmp/gpt-builder-engine')
          PY

      - name: Verify original engine integrity and smoke build
        run: >-
          python /tmp/gpt-builder-engine/scripts/selftest_distribution_engine.py
          --source /tmp/gpt-builder-engine

      - name: Install canonical engine in release checkout
        run: >-
          python /tmp/gpt-builder-engine/scripts/install_distribution_engine.py
          --source /tmp/gpt-builder-engine
          --project-root "$GITHUB_WORKSPACE"

      - name: Run canonical lint and final source hygiene
        shell: bash
        run: |
          set -euo pipefail
          python scripts/lint_gpt_project.py --project-root .
          python scripts/project_hygiene.py --project-root . --mode final

      - name: Build five release runtime distributions
        run: >-
          python scripts/build_distributions.py
          --project-root .
          --version '${{ steps.version.outputs.version }}'

      - name: Validate five release distributions
        run: python scripts/validate_distributions.py --project-root .

      - name: Gate exact canonical delivery archives and checksums
        run: >-
          python scripts/verify_canonical_delivery.py
          --project-root .
          --version '${{ steps.version.outputs.version }}'

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload '${{ github.event.release.tag_name }}' \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            dist/DELIVERY-MANIFEST.json \
            --clobber
