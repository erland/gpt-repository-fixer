name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --upgrade pyyaml jsonschema pytest

      - name: Run deterministic and E2E tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Lint canonical GPT project
        run: python scripts/lint_gpt_project.py --project-root .

      - name: Validate project hygiene
        run: python scripts/project_hygiene.py --project-root . --mode final

      - name: Build all peer distributions
        run: python scripts/build_distributions.py --project-root . --version 0.0.0-ci --targets project,chat,custom-gpt,opencode,plugin

      - name: Validate built distributions
        run: python scripts/validate_distributions.py --project-root .

      - name: Validate generalized runtime parity
        run: python scripts/validate_runtime_parity.py --project-root . --build-root build

      - name: Validate runtime parity and release readiness
        run: python scripts/validate_release_readiness.py --project-root . --build-root build

      - name: Upload CI distributions
        if: ${{ always() && hashFiles('dist/*.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: repository-fixer-ci-distributions
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          if-no-files-found: error
          retention-days: 7

  canonical-engine-preflight:
    name: GPT Byggaren 1.6.33 original engine self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install canonical engine test dependencies
        run: python -m pip install pyyaml jsonschema

      - name: Download pinned canonical engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/gpt-byggaren-engine-1.6.33.zip \
            https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip
          python - <<'PY'
          import pathlib, zipfile
          path = pathlib.Path('/tmp/gpt-byggaren-engine-1.6.33.zip')
          with zipfile.ZipFile(path) as archive:
              for item in archive.infolist():
                  parts = pathlib.PurePosixPath(item.filename)
                  if parts.is_absolute() or '..' in parts.parts or not parts.parts:
                      raise ValueError(f'Unsafe engine archive entry: {item.filename}')
              archive.extractall('/tmp/gpt-builder-engine')
          PY

      - name: Verify original engine integrity and smoke build
        run: >-
          python /tmp/gpt-builder-engine/scripts/selftest_distribution_engine.py
          --source /tmp/gpt-builder-engine

      - name: Create isolated legacy migration assessment
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/gpt-builder-engine/scripts/migrate_legacy_copy.py \
            --source "$GITHUB_WORKSPACE" \
            --destination /tmp/repository-fixer-migration-preview
          test -f /tmp/repository-fixer-migration-preview/MIGRATION-REPORT.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/repository-fixer-migration-preview/MIGRATION-REPORT.json').read_text())
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Probe original installer and five-runtime build in isolated migration copy
        run: >-
          python scripts/preview_canonical_migration.py
          --project-root /tmp/repository-fixer-migration-preview
          --engine-root /tmp/gpt-builder-engine

      - name: Exercise packaged Repository Fixer domain functions
        run: >-
          python scripts/verify_packaged_domain_smoke.py
          --project-root /tmp/repository-fixer-migration-preview

      - name: Upload isolated canonical build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: repository-fixer-canonical-build-diagnostics
          path: /tmp/repository-fixer-migration-preview/MIGRATION-BUILD-REPORT.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload migration preview report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: repository-fixer-migration-preview
          path: /tmp/repository-fixer-migration-preview/MIGRATION-REPORT.json
          if-no-files-found: warn
          retention-days: 7
